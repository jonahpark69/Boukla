  <!-- JS — Mini-panier -->
  <script defer src="cart.js"></script>

  <!-- JS — Remplit la fiche selon le slug et BRANCHE le bouton existant -->
  <script>
  (function(){
    const isFile = location.protocol === 'file:';
    const DATA_URL = 'products.json';

    function getSlug(){
      // 1) /produit/<slug>
      const m = location.pathname.match(/(?:^|\/)produit\/([^\/?#]+)$/i);
      if (m) return decodeURIComponent(m[1]);
      // 2) ?slug=<slug> (fallback depuis la modale en file://)
      const q = new URLSearchParams(location.search).get('slug');
      return q || '';
    }

    const $ = (s,c=document)=>c.querySelector(s);

    function setText(sel, txt){ const el = $(sel); if (el) el.textContent = txt || ''; }
    function setAttr(sel, attr, val){ const el = $(sel); if (el && val!=null) el.setAttribute(attr, val); }
    function setMeta(name, content){
      let m = document.querySelector(`meta[name="${name}"]`);
      if (!m){ m = document.createElement('meta'); m.setAttribute('name', name); document.head.appendChild(m); }
      m.setAttribute('content', content || '');
    }
    function setOG(prop, content){
      let m = document.querySelector(`meta[property="${prop}"]`);
      if (!m){ m = document.createElement('meta'); m.setAttribute('property', prop); document.head.appendChild(m); }
      m.setAttribute('content', content || '');
    }
    function setCanonical(url){
      let link = document.getElementById('canonical');
      if (!link){ link = document.createElement('link'); link.id='canonical'; link.rel='canonical'; document.head.appendChild(link); }
      link.href = url || '';
    }

    function toAbs(src){
      try { return new URL(src, location.origin).href; } catch(e){ return src; }
    }

    async function loadProducts(){
      // 1) JSON inline
      const inline = document.getElementById('products-json');
      if (inline && inline.textContent.trim()){
        return JSON.parse(inline.textContent);
      }
      // 2) Variable globale (si tu crées products.js)
      if (Array.isArray(window.PRODUCTS)) return window.PRODUCTS;
      // 3) Fetch (nécessite http/https)
      if (isFile) throw new Error('fetch bloqué en file://');
      const res = await fetch(DATA_URL, { cache:'no-store' });
      return res.json();
    }

    function wireAddToCart(slug, p, mainImage){
      // On BRANCHE le bouton existant (pas de nouveau bouton)
      const btn = document.querySelector('.p-actions .btn--primary');
      if (!btn) return;
      btn.setAttribute('data-add-to-cart','');
      btn.dataset.id = slug;
      btn.dataset.name = p.name;
      btn.dataset.price = p.price;
      btn.dataset.image = mainImage || '';
      // Ne pas auto-ouvrir (cart.js n'ouvre jamais sur add de toute façon)
      // btn.dataset.openCart = 'false'; // inutile mais possible
    }

    function render(p, slug){
      // Breadcrumb + titre
      setText('#bc-name',  p.name);
      setText('#p-title',  p.name);
      setText('#p-short',  p.short);
      setText('#p-desc',   p.description);

      // Prix
      const price = new Intl.NumberFormat('fr-FR', { style:'currency', currency:p.currency || 'EUR' }).format(p.price || 0);
      setText('#p-price', price);

      // Badges
      const badgesWrap = document.getElementById('p-badges');
      badgesWrap.innerHTML = '';
      if (Array.isArray(p.badges) && p.badges.length){
        p.badges.forEach(b => {
          const span = document.createElement('span');
          span.className = 'p-badge'; span.textContent = b;
          badgesWrap.appendChild(span);
        });
        badgesWrap.hidden = false;
      } else { badgesWrap.hidden = true; }

      // Listes
      function fillList(id, arr, wrapId){
        const ul = document.getElementById(id);
        const wrap = document.getElementById(wrapId);
        ul.innerHTML = '';
        if (Array.isArray(arr) && arr.length){
          arr.forEach(t => { const li=document.createElement('li'); li.textContent=t; ul.appendChild(li); });
          wrap.hidden = false;
        } else wrap.hidden = true;
      }
      fillList('p-benefits', p.benefits, 'p-benefits-wrap');
      fillList('p-actives',  p.actives,  'p-actives-wrap');

      // How-to
      if (p.how_to){ document.getElementById('p-howto').textContent = p.how_to; document.getElementById('p-howto-wrap').hidden = false; }

      // Images
      const main = (p.images && p.images[0]) || '';
      setAttr('#p-image', 'src', main);
      setAttr('#p-image', 'alt', p.name);

      const thumbs = document.getElementById('p-thumbs');
      thumbs.innerHTML = '';
      (p.images || []).forEach((src, i) => {
        const b = document.createElement('button'); b.type='button'; b.className='thumb';
        const im = document.createElement('img'); im.src = src; im.alt='';
        b.appendChild(im);
        b.addEventListener('click', () => { setAttr('#p-image','src',src); });
        thumbs.appendChild(b);
      });

      // SEO head
      const canonicalURL = (isFile ? new URL(`product.html?slug=${slug}`, location.href).href
                                   : new URL(`/produit/${slug}`, location.origin).href);
      document.title = `${p.name} — Boukla`;
      setMeta('description', p.short || p.description || '');
      setCanonical(canonicalURL);
      setOG('og:title',       `${p.name} — Boukla`);
      setOG('og:description', p.short || p.description || '');
      setOG('og:image',       main ? toAbs(main) : '');
      setOG('og:url',         canonicalURL);

      // JSON-LD Product
      const ld = {
        "@context":"https://schema.org",
        "@type":"Product",
        "name": p.name,
        "description": p.description || p.short || "",
        "image": main ? toAbs(main) : undefined,
        "sku": slug,
        "brand": { "@type":"Brand", "name":"Boukla" },
        "offers": {
          "@type": "Offer",
          "url": canonicalURL,
          "priceCurrency": p.currency || "EUR",
          "price": (p.price || 0).toString(),
          "availability": "https://schema.org/InStock"
        }
      };
      const s = document.createElement('script');
      s.type='application/ld+json'; s.textContent = JSON.stringify(ld);
      document.head.appendChild(s);

      // Brancher le bouton panier (existant)
      wireAddToCart(slug, p, main);
    }

    async function init(){
      const slug = getSlug();
      if (!slug){ location.href = 'shop.html'; return; }
      let list = [];
      try { list = await loadProducts(); }
      catch(e){ alert("Impossible de charger les produits (mode fichier sans JSON inline)." ); return; }
      const p = list.find(x => x.slug === slug);
      if (!p){ location.href = 'shop.html'; return; }
      render(p, slug);
    }

    init();
  })();
  </script>
</body>
